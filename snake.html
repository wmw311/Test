<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }
  .game-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    color: #e8e8e8;
  }
  .title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #4ade80, #22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .scores { display: flex; gap: 18px; }
  .score-box {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 6px 14px;
    text-align: center;
    min-width: 78px;
  }
  .score-box .label { font-size: 11px; color: #94a3b8; letter-spacing: 2px; }
  .score-box .value { font-size: 20px; font-weight: 700; color: #4ade80; }
  .score-box.best .value { color: #fbbf24; }

  .board-box {
    position: relative;
    border-radius: 14px;
    padding: 6px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  canvas {
    display: block;
    border-radius: 10px;
    background: #0d1526;
  }
  .overlay {
    position: absolute;
    inset: 6px;
    border-radius: 10px;
    background: rgba(10, 15, 30, 0.82);
    backdrop-filter: blur(4px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: #fff;
    text-align: center;
    transition: opacity .25s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h2 { font-size: 34px; letter-spacing: 6px; }
  .overlay p { color: #94a3b8; font-size: 14px; line-height: 1.8; }
  .overlay .final-score { font-size: 18px; color: #4ade80; }
  .btn {
    padding: 12px 38px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #06281a;
    background: linear-gradient(135deg, #4ade80, #22d3ee);
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 6px 20px rgba(74,222,128,0.35);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(74,222,128,0.5); }
  .btn:active { transform: translateY(0); }

  .tips {
    color: #7d8aa3;
    font-size: 12px;
    letter-spacing: 1px;
  }
  .tips kbd {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 4px;
    padding: 1px 7px;
    font-family: inherit;
    color: #cbd5e1;
  }

  /* 移动端方向键 */
  .dpad {
    display: none;
    grid-template-columns: repeat(3, 62px);
    grid-template-rows: repeat(3, 62px);
    gap: 6px;
    margin-top: 4px;
  }
  .dpad button {
    border: none;
    border-radius: 12px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    color: #e2e8f0;
    font-size: 24px;
    cursor: pointer;
  }
  .dpad button:active { background: rgba(74,222,128,0.35); }
  .dpad .up    { grid-column: 2; grid-row: 1; }
  .dpad .left  { grid-column: 1; grid-row: 2; }
  .dpad .down  { grid-column: 2; grid-row: 3; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  @media (hover: none) and (pointer: coarse) {
    .dpad { display: grid; }
    .tips { display: none; }
  }
</style>
</head>
<body>
<div class="game-wrap">
  <div class="header">
    <div class="title">贪吃蛇</div>
    <div class="scores">
      <div class="score-box"><div class="label">得分</div><div class="value" id="score">0</div></div>
      <div class="score-box best"><div class="label">最高</div><div class="value" id="best">0</div></div>
    </div>
  </div>

  <div class="board-box">
    <canvas id="game" width="440" height="440"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">贪吃蛇</h2>
      <p id="ovText">方向键 / WASD 控制移动<br><kbd>空格</kbd> 暂停 &nbsp; <kbd>R</kbd> 重新开始</p>
      <div class="final-score" id="ovScore" style="display:none"></div>
      <button class="btn" id="startBtn">开始游戏</button>
    </div>
  </div>

  <div class="tips"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 &nbsp;·&nbsp; <kbd>空格</kbd> 暂停 &nbsp;·&nbsp; <kbd>R</kbd> 重开</div>

  <div class="dpad">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◀</button>
    <button class="down" data-dir="down">▼</button>
    <button class="right" data-dir="right">▶</button>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const ovScore = document.getElementById('ovScore');
  const startBtn = document.getElementById('startBtn');

  const GRID = 22;                 // 网格数 22x22
  const CELL = canvas.width / GRID;
  const BASE_SPEED = 150;          // 初始步进间隔 ms
  const MIN_SPEED = 60;            // 最快速度

  let snake, dir, nextDir, food, score, best, timer, running, paused, speed;

  best = parseInt(localStorage.getItem('snake_best') || '0', 10);
  bestEl.textContent = best;

  function reset() {
    snake = [{x: 10, y: 11}, {x: 9, y: 11}, {x: 8, y: 11}];
    dir = {x: 1, y: 0};
    nextDir = dir;
    score = 0;
    speed = BASE_SPEED;
    scoreEl.textContent = 0;
    placeFood();
    draw();
  }

  function placeFood() {
    while (true) {
      const f = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
      if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; return; }
    }
  }

  function start() {
    reset();
    running = true;
    paused = false;
    overlay.classList.add('hidden');
    clearInterval(timer);
    timer = setInterval(tick, speed);
  }

  function gameOver() {
    running = false;
    clearInterval(timer);
    if (score > best) {
      best = score;
      localStorage.setItem('snake_best', best);
      bestEl.textContent = best;
    }
    ovTitle.textContent = '游戏结束';
    ovText.innerHTML = score >= best && score > 0 ? '新纪录！再接再厉 🎉' : '按 R 或点击按钮再来一局';
    ovScore.style.display = 'block';
    ovScore.textContent = '本局得分：' + score;
    startBtn.textContent = '再来一局';
    overlay.classList.remove('hidden');
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      clearInterval(timer);
      ovTitle.textContent = '已暂停';
      ovText.innerHTML = '按 <kbd>空格</kbd> 继续';
      ovScore.style.display = 'none';
      startBtn.textContent = '继续游戏';
      overlay.classList.remove('hidden');
    } else {
      overlay.classList.add('hidden');
      timer = setInterval(tick, speed);
    }
  }

  function tick() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 撞墙
    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) return gameOver();
    // 撞自己
    if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      placeFood();
      // 每吃 3 个加速一次
      if (score % 30 === 0 && speed > MIN_SPEED) {
        speed = Math.max(MIN_SPEED, speed - 10);
        clearInterval(timer);
        timer = setInterval(tick, speed);
      }
    } else {
      snake.pop();
    }
    draw();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    // 背景与棋盘格
    ctx.fillStyle = '#0d1526';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = 'rgba(255,255,255,0.025)';
    for (let y = 0; y < GRID; y++) {
      for (let x = 0; x < GRID; x++) {
        if ((x + y) % 2 === 0) ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }

    // 食物（带光晕）
    const fx = food.x * CELL + CELL / 2, fy = food.y * CELL + CELL / 2;
    const glow = ctx.createRadialGradient(fx, fy, 1, fx, fy, CELL);
    glow.addColorStop(0, 'rgba(248,113,113,0.55)');
    glow.addColorStop(1, 'rgba(248,113,113,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(food.x * CELL - CELL/2, food.y * CELL - CELL/2, CELL * 2, CELL * 2);
    ctx.fillStyle = '#f87171';
    ctx.beginPath();
    ctx.arc(fx, fy, CELL * 0.32, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath();
    ctx.arc(fx - CELL * 0.1, fy - CELL * 0.1, CELL * 0.09, 0, Math.PI * 2);
    ctx.fill();

    // 蛇身
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const t = i / snake.length;
      if (i === 0) {
        ctx.fillStyle = '#4ade80';
      } else {
        const g = Math.round(222 - t * 90);
        const b = Math.round(128 - t * 50);
        ctx.fillStyle = `rgb(34, ${g}, ${b})`;
      }
      const pad = i === 0 ? 1.5 : 2.5;
      roundRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 6);
      ctx.fill();

      // 蛇眼睛
      if (i === 0) {
        ctx.fillStyle = '#0d1526';
        const cx = s.x * CELL + CELL / 2, cy = s.y * CELL + CELL / 2;
        const ox = dir.x * CELL * 0.18, oy = dir.y * CELL * 0.18;
        const px = dir.y !== 0 ? CELL * 0.18 : 0;
        const py = dir.x !== 0 ? CELL * 0.18 : 0;
        ctx.beginPath();
        ctx.arc(cx + ox + px, cy + oy + py, 2.2, 0, Math.PI * 2);
        ctx.arc(cx + ox - px, cy + oy - py, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  const DIRS = {
    up:    {x: 0, y: -1},
    down:  {x: 0, y: 1},
    left:  {x: -1, y: 0},
    right: {x: 1, y: 0}
  };

  function setDir(name) {
    const d = DIRS[name];
    if (!d) return;
    // 禁止直接反向
    if (d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
  }

  const KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right'
  };

  document.addEventListener('keydown', (e) => {
    if (KEYMAP[e.key]) {
      e.preventDefault();
      if (running && !paused) setDir(KEYMAP[e.key]);
    } else if (e.key === ' ') {
      e.preventDefault();
      if (!running) start(); else togglePause();
    } else if (e.key === 'r' || e.key === 'R') {
      start();
    }
  });

  startBtn.addEventListener('click', () => {
    if (running && paused) togglePause();
    else start();
  });

  // 移动端按钮
  document.querySelectorAll('.dpad button').forEach(btn => {
    btn.addEventListener('click', () => { if (running && !paused) setDir(btn.dataset.dir); });
  });

  // 滑动手势
  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, {passive: true});
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 'right' : 'left');
    else setDir(dy > 0 ? 'down' : 'up');
    touchStart = null;
  }, {passive: true});

  reset();
})();
</script>
</body>
</html>
