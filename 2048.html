<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 60%, #1e1b4b 100%);
    font-family: "Segoe UI", "Microsoft YaHei", -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 92vw;
    max-width: 460px;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    color: #e2e8f0;
  }
  .title {
    font-size: 56px;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #fbbf24, #f97316, #ef4444);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1;
  }
  .scores { display: flex; gap: 10px; position: relative; }
  .score-box {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 8px 16px;
    text-align: center;
    min-width: 84px;
  }
  .score-box .label { font-size: 11px; color: #94a3b8; letter-spacing: 2px; text-transform: uppercase; }
  .score-box .value { font-size: 24px; font-weight: 800; color: #fbbf24; margin-top: 2px; }
  .score-box.best .value { color: #38bdf8; }
  .score-add {
    position: absolute;
    color: #fbbf24;
    font-weight: 800;
    font-size: 20px;
    pointer-events: none;
    animation: floatUp 0.8s ease-out forwards;
    top: -6px; right: 4px;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-28px); }
  }

  .sub {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    color: #94a3b8;
    font-size: 13px;
    line-height: 1.6;
  }
  .sub .hint { max-width: 62%; }
  .actions { display: flex; gap: 8px; }
  .btn {
    padding: 9px 18px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #e2e8f0;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 10px;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .btn:hover { background: rgba(255,255,255,0.18); }
  .btn:active { transform: scale(0.96); }
  .btn.primary {
    background: linear-gradient(135deg, #f97316, #ef4444);
    border: none;
    color: #fff;
  }
  .btn.primary:hover { filter: brightness(1.08); }

  .board {
    position: relative;
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 12px;
    width: 100%;
    aspect-ratio: 1 / 1;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
    touch-action: none;
  }
  .grid-bg, .tiles {
    position: absolute;
    inset: 12px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 12px;
  }
  .cell { background: rgba(255,255,255,0.04); border-radius: 10px; }
  .tiles { pointer-events: none; }

  .tile {
    position: absolute;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    transition: transform 0.14s cubic-bezier(0.3, 0.9, 0.4, 1.1);
    will-change: transform;
  }
  .tile.new { animation: pop 0.18s ease-out; }
  .tile.merged { animation: merge 0.2s ease-out; }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
  @keyframes merge { 0% { transform: scale(1); } 50% { transform: scale(1.22); } 100% { transform: scale(1); } }

  .overlay {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    background: rgba(10, 15, 30, 0.85);
    backdrop-filter: blur(4px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: #fff;
    text-align: center;
    z-index: 10;
    transition: opacity .25s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h2 { font-size: 36px; font-weight: 800; letter-spacing: 2px; }
  .overlay h2.win { color: #fbbf24; }
  .overlay h2.lose { color: #f87171; }
  .overlay p { color: #94a3b8; font-size: 14px; }

  .tips { color: #64748b; font-size: 12px; letter-spacing: 0.5px; text-align: center; }
  .tips kbd {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 4px;
    padding: 1px 7px;
    font-family: inherit;
    color: #cbd5e1;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="title">2048</div>
    <div class="scores">
      <div class="score-box"><div class="label">得分</div><div class="value" id="score">0</div></div>
      <div class="score-box best"><div class="label">最高</div><div class="value" id="best">0</div></div>
      <div id="scoreAdd"></div>
    </div>
  </div>

  <div class="sub">
    <div class="hint">合并相同数字方块，凑出 <b style="color:#fbbf24">2048</b> 即获胜！</div>
    <div class="actions">
      <button class="btn" id="undoBtn">撤销</button>
      <button class="btn primary" id="newBtn">新游戏</button>
    </div>
  </div>

  <div class="board" id="board">
    <div class="grid-bg" id="gridBg"></div>
    <div class="tiles" id="tiles"></div>
    <div class="overlay hidden" id="overlay">
      <h2 id="ovTitle"></h2>
      <p id="ovText"></p>
      <div class="actions">
        <button class="btn" id="continueBtn" style="display:none">继续游戏</button>
        <button class="btn primary" id="restartBtn">再来一局</button>
      </div>
    </div>
  </div>

  <div class="tips"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 &nbsp;·&nbsp; <kbd>Z</kbd> 撤销 &nbsp;·&nbsp; <kbd>R</kbd> 新游戏</div>
</div>

<script>
(function () {
  const N = 4;
  const gridBg = document.getElementById('gridBg');
  const tilesEl = document.getElementById('tiles');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const continueBtn = document.getElementById('continueBtn');
  const scoreAddWrap = document.getElementById('scoreAdd');

  let board, score, best, history, won, keepGoing, tileId;

  best = parseInt(localStorage.getItem('best2048') || '0', 10);
  bestEl.textContent = best;

  const COLORS = {
    2:    { bg: '#eef2ff', fg: '#1e293b' },
    4:    { bg: '#e0e7ff', fg: '#1e293b' },
    8:    { bg: '#fde68a', fg: '#7c2d12' },
    16:   { bg: '#fcd34d', fg: '#7c2d12' },
    32:   { bg: '#fbbf24', fg: '#fff' },
    64:   { bg: '#f97316', fg: '#fff' },
    128:  { bg: '#ef4444', fg: '#fff' },
    256:  { bg: '#e11d48', fg: '#fff' },
    512:  { bg: '#be185d', fg: '#fff' },
    1024: { bg: '#a21caf', fg: '#fff' },
    2048: { bg: '#7c3aed', fg: '#fff' },
    4096: { bg: '#4338ca', fg: '#fff' },
    8192: { bg: '#1e3a8a', fg: '#fff' }
  };
  function colorFor(v) { return COLORS[v] || { bg: '#0f172a', fg: '#fbbf24' }; }

  for (let i = 0; i < N * N; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    gridBg.appendChild(c);
  }

  function emptyGrid() {
    const g = [];
    for (let i = 0; i < N; i++) g.push([null, null, null, null]);
    return g;
  }

  function newGame() {
    board = emptyGrid();
    score = 0;
    history = [];
    won = false;
    keepGoing = false;
    tileId = 1;
    scoreEl.textContent = '0';
    overlay.classList.add('hidden');
    addRandomTile();
    addRandomTile();
    render();
  }

  function cloneBoard() {
    return board.map(row => row.map(c => c ? { ...c } : null));
  }

  function emptyCells() {
    const cells = [];
    for (let r = 0; r < N; r++)
      for (let c = 0; c < N; c++)
        if (!board[r][c]) cells.push([r, c]);
    return cells;
  }

  function addRandomTile() {
    const cells = emptyCells();
    if (!cells.length) return false;
    const [r, c] = cells[Math.floor(Math.random() * cells.length)];
    board[r][c] = { id: tileId++, value: Math.random() < 0.9 ? 2 : 4, isNew: true };
    return true;
  }

  function cellSize() {
    const rect = tilesEl.getBoundingClientRect();
    const gap = 12;
    return Math.max(1, (rect.width - gap * (N - 1)) / N);
  }

  function render() {
    tilesEl.innerHTML = '';
    const size = cellSize();
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const t = board[r][c];
        if (!t) continue;
        const el = document.createElement('div');
        const col = colorFor(t.value);
        el.className = 'tile' + (t.isNew ? ' new' : '') + (t.isMerged ? ' merged' : '');
        el.textContent = t.value;
        el.style.background = col.bg;
        el.style.color = col.fg;
        const len = String(t.value).length;
        let fs = size * 0.5;
        if (len >= 3) fs = size * 0.42;
        if (len >= 4) fs = size * 0.33;
        el.style.fontSize = fs + 'px';
        el.style.width = size + 'px';
        el.style.height = size + 'px';
        el.style.transform = `translate(${c * (size + 12)}px, ${r * (size + 12)}px)`;
        tilesEl.appendChild(el);
        t.isNew = false;
        t.isMerged = false;
      }
    }
  }

  function move(dir) {
    if (!overlay.classList.contains('hidden')) return;

    const prevBoard = cloneBoard();
    const prevScore = score;

    let moved = false;
    let gained = 0;

    const lines = [];
    for (let i = 0; i < N; i++) {
      const line = [];
      for (let j = 0; j < N; j++) {
        let r, c;
        if (dir === 'left')      { r = i; c = j; }
        else if (dir === 'right'){ r = i; c = N - 1 - j; }
        else if (dir === 'up')   { r = j; c = i; }
        else                     { r = N - 1 - j; c = i; }
        line.push({ r, c, tile: board[r][c] });
      }
      lines.push(line);
    }

    board = emptyGrid();

    for (const line of lines) {
      const tiles = line.filter(x => x.tile);
      const result = [];
      let k = 0;
      while (k < tiles.length) {
        if (k + 1 < tiles.length && tiles[k].tile.value === tiles[k + 1].tile.value) {
          const merged = { id: tileId++, value: tiles[k].tile.value * 2, isMerged: true };
          result.push(merged);
          gained += merged.value;
          if (merged.value === 2048 && !won) won = true;
          k += 2;
        } else {
          result.push(tiles[k].tile);
          k++;
        }
      }
      for (let idx = 0; idx < result.length; idx++) {
        const pos = line[idx];
        board[pos.r][pos.c] = result[idx];
      }
      for (let idx = 0; idx < N; idx++) {
        const orig = line[idx].tile;
        const now = board[line[idx].r][line[idx].c];
        if ((orig && !now) || (!orig && now) || (orig && now && orig.id !== now.id)) {
          moved = true;
        }
      }
    }

    if (!moved) return;

    history.push({ board: prevBoard, score: prevScore });
    if (history.length > 20) history.shift();

    score += gained;
    scoreEl.textContent = score;
    if (gained > 0) showScoreAdd(gained);
    if (score > best) {
      best = score;
      localStorage.setItem('best2048', best);
      bestEl.textContent = best;
    }

    addRandomTile();
    render();

    if (won && !keepGoing) {
      showOverlay('win');
    } else if (!canMove()) {
      showOverlay('lose');
    }
  }

  function canMove() {
    if (emptyCells().length) return true;
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const v = board[r][c].value;
        if (c + 1 < N && board[r][c + 1].value === v) return true;
        if (r + 1 < N && board[r + 1][c].value === v) return true;
      }
    }
    return false;
  }

  function showOverlay(type) {
    if (type === 'win') {
      ovTitle.textContent = '🎉 你赢了！';
      ovTitle.className = 'win';
      ovText.textContent = '凑到 2048 了！可以继续挑战更大的数字。';
      continueBtn.style.display = 'inline-block';
    } else {
      ovTitle.textContent = '游戏结束';
      ovTitle.className = 'lose';
      ovText.textContent = '没有可移动的方块了。';
      continueBtn.style.display = 'none';
    }
    overlay.classList.remove('hidden');
  }

  function showScoreAdd(val) {
    const el = document.createElement('div');
    el.className = 'score-add';
    el.textContent = '+' + val;
    scoreAddWrap.appendChild(el);
    setTimeout(() => el.remove(), 800);
  }

  function undo() {
    if (!history.length) return;
    const prev = history.pop();
    board = prev.board;
    score = prev.score;
    scoreEl.textContent = score;
    overlay.classList.add('hidden');
    render();
  }

  const KEYMAP = {
    ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
    a: 'left', d: 'right', w: 'up', s: 'down',
    A: 'left', D: 'right', W: 'up', S: 'down'
  };

  document.addEventListener('keydown', (e) => {
    if (KEYMAP[e.key]) {
      e.preventDefault();
      move(KEYMAP[e.key]);
    } else if (e.key === 'z' || e.key === 'Z') {
      undo();
    } else if (e.key === 'r' || e.key === 'R') {
      newGame();
    }
  });

  document.getElementById('newBtn').addEventListener('click', newGame);
  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('restartBtn').addEventListener('click', newGame);
  continueBtn.addEventListener('click', () => {
    keepGoing = true;
    overlay.classList.add('hidden');
  });

  let touchStart = null;
  const boardEl = document.getElementById('board');
  boardEl.addEventListener('touchstart', (e) => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  boardEl.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
    touchStart = null;
  }, { passive: true });

  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

  window.addEventListener('resize', render);

  newGame();
})();
</script>
</body>
</html>
